[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mllooper"
version = "0.0.2"
description = "Primitives for machine learning pipelines"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Dominik Mairhöfer", email = "dominik@mairhoefer.xyz" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pip",
    "coloredlogs",
    "click",
    "gitpython",
    "pyyaml",
    "pydantic>=2,<3",
    "yaloader @ git+https://github.com/DominikMa/yaloader.git@master",
    "torch>=2.0",
    "torchvision",
    "tensorboard",
    "matplotlib",
]

[project.scripts]
mllooper = "mllooper.run:cli"

[project.urls]
Homepage = "https://github.com/DominikMa/mllooper"
Documentation = "https://mllooper.readthedocs.io"
"Bug Tracker" = "https://github.com/DominikMa/mllooper/issues"

[project.optional-dependencies]
docs = [
    "autodoc-pydantic>=2.2.0",
    "furo>=2025.12.19",
    "jupyter-server>=2.17.0",
    "myst-nb>=1.3.0",
    "sphinx>=7.4.7",
    "sphinx-remove-toctrees>=1.0.0.post1",
]

# Keep PyPI's CUDA-enabled Linux builds by default.
[tool.uv]
default-groups = ["dev", "gpu"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "ANN", "B", "UP", "SIM", "TCH", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"src/mllooper/__init__.py" = ["I001"]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests as slow to run"]

[tool.coverage.run]
source = ["mllooper"]

[tool.coverage.report]
fail_under = 50

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
unused-type-ignore-comment = "ignore"
unsupported-base = "ignore"

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[dependency-groups]
# CPU development: uv sync --no-group gpu --group cpu
cpu = [
    "torch>=2.0",
    "torchvision",
]
gpu = [
    "torch>=2.0",
    "torchvision",
]
dev = [
    "autodoc-pydantic>=2.2.0",
    "coverage>=7.10.7",
    "furo>=2025.12.19",
    "jupyter-server>=2.17.0",
    "myst-nb>=1.3.0",
    "pyright>=1.1",
    "pytest>=8.4.2",
    "ruff>=0.15.5",
    "sphinx>=7.4.7",
    "sphinx-remove-toctrees>=1.0.0.post1",
    "ty>=0.0.1a1",
]
